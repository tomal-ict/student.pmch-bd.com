# ==============================================================================
# aaPanel / Nginx Configuration for Popular Medical College Student Portal
# ==============================================================================
# In aaPanel: Go to Website -> Site Settings -> "URL Rewrite" tab.
# Paste the rewrite rules below and click Save.
#
# If configuring Nginx directly on a VPS, place these location blocks
# inside your domain's server { ... } block.
# ==============================================================================

# 1. API Direct Routing to Laravel backend
location ^~ /api/ {
    try_files $uri $uri/ /backend/public/index.php?$query_string;
}

# 2. Backend Public Directory Routing
location ^~ /backend/public/ {
    try_files $uri $uri/ /backend/public/index.php?$query_string;
}

# 3. Storage Directory for Public Attachments & Photos
location ^~ /storage/ {
    alias /www/wwwroot/your_site_folder/backend/storage/app/public/;
    try_files $uri $uri/ =404;
    access_log off;
    expires 30d;
}

# 4. Admin Direct Route (/myadmin)
location = /myadmin {
    try_files $uri /index.php?page=myadmin&$query_string;
}

location = /myadmin/ {
    try_files $uri /index.php?page=myadmin&$query_string;
}

# 5. Root Single Page Application Routing
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 6. PHP FastCGI execution (pass Authorization header)
location ~ \.php$ {
    # Ensure Authorization headers are passed to PHP-FPM
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_AUTHORIZATION $http_x_authorization;
    fastcgi_param HTTP_X_AUTH_TOKEN $http_x_auth_token;
    
    # Standard aaPanel PHP-FPM include (adjust PHP version if needed)
    # include enable-php-82.conf;
}
